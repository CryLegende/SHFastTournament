#
# Codes couleur avec '&'. Les messages de commande suivent le format
# &7&l« &<c>&lSH &8&l» &7texte (&a succès, &e info, &6 avertissement, &c erreur).
#
# ======================================================================== #

tournament-start:
- '&f█████████'
- '&f█&8███&f█&8█&f█&8█&f█'
