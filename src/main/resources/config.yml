# shfasttournament.admin pour l'accès à la commande
settings:
  minimum-players: 10 # 20 # Minimum amount of players required to start a tournament
  interval: 24-40 # in min (peut être une plage, par exemple "10-20", ou un seul nombre comme "3")
  join-message-delay: 3 # en sec, delai avant d'annoncer le tournoi en cours a un joueur qui se connecte
  
  sounds:
    tournament-start: ENTITY_EXPERIENCE_ORB_PICKUP
    tournament-end: ENTITY_PLAYER_LEVELUP
  
  rewards: # Chaque récompense est définie par top1, top2, top3 et participation
    top1:
    - sm %player% &7&l« &a&lSH &8&l» &7Vous avez fini &a1er &7 !
    - 'sm %player% &7(Récompenses: 10k SHCoins, 2 Luckyblocks Jaune, 2 Clés Ordinaire)'
    - eco give %player% 10000
    - shwc %player% ntdluckyblock give %player% YELLOW 2
    - shwc %player% shcrates givekey %player% ordinaire 2 physical
    - shnetworklevel exp give %player% 10
    - sm %player% &b+10 exp de network &7(/network)
    top2:
    - sm %player% &7&l« &e&lSH &8&l» &7Vous avez fini &e2eme &7 !
    - 'sm %player% &7(Récompenses: 10k SHCoins, 1 Luckyblock Jaune, 1 Clé Ordinaire)'
    - eco give %player% 10000
    - shwc %player% ntdluckyblock give %player% YELLOW 1
    - shwc %player% shcrates givekey %player% ordinaire 1 physical
    - shnetworklevel exp give %player% 5
    - sm %player% &b+5 exp de network &7(/network)
    top3:
    - sm %player% &7&l« &6&lSH &8&l» &7Vous avez fini &63eme &7 !
    - 'sm %player% &7(Récompense: 1 Clé Ordinaire)'
    - shwc %player% shcrates givekey %player% ordinaire 1 physical
    - shnetworklevel exp give %player% 5
    - sm %player% &b+5 exp de network &7(/network)
    participation:
    - 'sm %player% &7(Récompense de participation: 5k SHCoins)'
    - eco give %player% 5000

messages:
  tournament-start:
  - '&f█████████'
  - '&f█&8███&f█&8█&f█&8█&f█'
  - '&f█&8█&f███&8█&f█&8█&f█       &5♥♠ &5&lMini tournois &5♣♦'
  - '&f█&8███&f█&8███&f█'
  - '&f███&8█&f█&8█&f█&8█&f█       &7[ &a%event-name% &7] &8(%duration%)'
  - '&f█&8███&f█&8█&f█&8█&f█ &7%description%'
  - '&f█████████'
  tournament-end:
  - ''
  - '&7&l« &5&lMini tournoi &8&l» &7Fin du tournoi: &a%event-name%'
  - '&e&lClassement'
  - '%results%'
  - ''
  # Envoye a un joueur qui se connecte pendant un tournoi. Liste vide = desactive.
  # Placeholders: %event-id% %event-name% %event-type% %description% %points-name% %participants% %time-left% %time-elapsed% %time-total%
  tournament-join:
  - ''
  - '&7&l« &5&lMini tournoi &8&l» &7Un mini tournoi est en cours: &a%event-name%'
  - '&f  ➥ &7%description%'
  - '&f  ➥ &7Temps restant: &f%time-left% &8| &7Participants: &f%participants%'
  - ''
  results: '&f • &7(&e#%place%&7) &e%player% &7- %points% %points-name%'
  personal-results: 'Vous: &7(&e#%place%&7) - &e%points% %points-name%'
  no-participation: '&7&l« &6&lSH &8&l» &7Vous n''avez pas participé à ce mini tournoi'
  no-winner: '&7&l« &c&lSH &8&l» &fPersonne n''a participé à ce tournoi'
  actionbar: ''
  # actionbar: '&5&lMini tournoi: &e%points% &7%points-name% (&e%time% sec restantes&7)'
  boss-bar: '&5&lMini tournoi: &e%event-name% &7- &e%points% &7%points-name% - (&f%time%&7)'
  unknown-command: '&7&l« &f&lSH &8&l» &fCommande inconnue, essayer autre chose.'
  no-perm: '&7&l« &f&lSH &8&l» &fCommande inconnue, essayer autre chose.'
  stop-success: '&7&l« &a&lSH &8&l» &7Le mini tournoi en cours a été arrêté.'
  stop-fail: '&7&l« &c&lSH &8&l» &cThere is no playing tournament !'
  start-success: '&7&l« &a&lSH &8&l» &aThe tournament %id% has just started.'
  already-playing: '&7&l« &c&lSH &8&l» &cA tournament is already running !'
  not-an-id: '&7&l« &c&lSH &8&l» &cThe id %id% is not a valid tournament id !'
  status-no-active: '&7&l« &c&lSH &8&l» &cAucun mini tournoi en cours.'
  status-no-leader: Aucun
  tournament-status:
  - '&f█████████'
  - '&f█&8███&f█&8█&f█&8█&f█'
  - '&f█&8█&f███&8█&f█&8█&f█       &5♥♠ &5&lStatut tournoi &5♣♦'
  - '&f█&8███&f█&8███&f█'
  - '&f███&8█&f█&8█&f█&8█&f█       &7[ &a%event-name% &7] &8(ID: %event-id%)'
  - '&f█&8███&f█&8█&f█&8█&f█ &7Type: &f%event-type% &8| &7Participants: &f%participants%'
  - '&f█&8█&f███&8█&f█&8█&f█ &7Temps: &f%time-elapsed%&8/&f%time-total% &8(reste:
    &f%time-left%&8)'
  - '&f███&8█&f█&8█&f█&8█&f█ &7Leader: &e%leader% &8- &e%leader-points% &7%points-name%'
  - '&f█████████'

