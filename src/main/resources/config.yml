# ======================================================================== #
#                SHFastTournament - Configuration Principale               #
# ======================================================================== #
#
# Plugin : mini-tournois automatiques (minage, pêche, combat...) lancés à
# intervalle aléatoire, avec récompenses pour le top 3 et la participation.
# Avec SHNetwork, un seul tournoi tourne pour tous les serveurs Opale (voir la
# section 'reseau' plus bas).
# Les messages sont dans 'messages.yml'.
#
# Commandes (/shfasttournament, alias /tournament) :
#   /shfasttournament start <id> [force]    Démarre un tournoi ('force' arrête celui en cours).
#   /shfasttournament stop                  Arrête le tournoi en cours.
#   /shfasttournament info                  Liste les tournois activés.
#   /shfasttournament status                Affiche le statut du tournoi en cours.
#   /shfasttournament custom <id> <joueur>  Ajoute un point à un joueur dans un tournoi CUSTOM.
#   /shfasttournament import                Avec SHNetwork : copie les victoires de wins.yml dans la base du réseau,
#                                           sans toucher aux joueurs qui y ont déjà un total.
#   /shfasttournament reload                Relit config.yml et messages.yml : réglages, récompenses, définitions des tournois.
#                                           Un tournoi en cours finit avec ses anciennes définitions. Si un fichier est invalide,
#                                           l'ancienne configuration reste active. wins.yml et la base ne sont pas touchés ;
#                                           la section 'reseau' n'est lue qu'au démarrage.
#   Sans argument, la commande affiche les sous-commandes que l'expéditeur a le droit d'utiliser. Elle marche depuis la console.
#
# Permissions :
#   shfasttournament.admin           Toutes les commandes ci-dessus (par défaut : op).
#   shfasttournament.admin.<start|stop|info|status|custom|import|reload>   Une commande chacune (par défaut : op).
#
# Placeholder : %shfasttournament_wins% = nombre de victoires du joueur (celles de tout le réseau avec SHNetwork).
#
# ======================================================================== #

settings:
  # Nombre minimum de joueurs en ligne pour lancer un tournoi automatique.
  minimum-players: 10

  # Délai en minutes avant le prochain tournoi automatique : un nombre ("3") ou une plage ("10-20").
  interval: 24-40

  # Délai en secondes avant d'annoncer le tournoi en cours à un joueur qui se connecte.
  join-message-delay: 3

  # Sons joués à tous les joueurs au début et à la fin d'un tournoi.
  sounds:
    tournament-start: ENTITY_EXPERIENCE_ORB_PICKUP
    tournament-end: ENTITY_PLAYER_LEVELUP

  # Commandes console exécutées pour chaque place du classement. %player% est le nom du joueur.
  # La participation récompense les joueurs au-delà du 3e dont les points atteignent la moitié de ceux du 3e.
  rewards:
    top1:
    - tell %player% Vous avez fini 1er !
    - give %player% diamond 5
    top2:
    - tell %player% Vous avez fini 2e !
    - give %player% diamond 3
    top3:
    - tell %player% Vous avez fini 3e !
    - give %player% diamond 1
    participation:
    - tell %player% Merci d'avoir participé !
    - give %player% iron_ingot 5

  # Écriture des récompenses dans SHLogs : une ligne par joueur récompensé.
  log:
    # Nom du fichier de log.
    file: recompenses
    # Texte de la ligne. Variables : %player%, %tournament%, %place%, %reward%.
    format: "%player% -> reçoit la récompense du tournoi %tournament% (place %place% : %reward%)"
    # Texte de %reward% pour chaque place. À tenir à jour avec les commandes de 'rewards'.
    rewards:
      top1: 5 diamants
      top2: 3 diamants
      top3: 1 diamant
      participation: 5 lingots de fer

# Tournoi unique pour tout le réseau Opale. Demande SHNetwork : sans lui, ou avec actif: false, chaque serveur
# lance ses propres tournois (minimum-players et interval comptent alors ses seuls joueurs) et garde les
# victoires dans wins.yml.
# Tous les serveurs affichent le même tournoi à la même heure et comptent les actions de leurs joueurs. Les points
# sont additionnés dans la base partagée : un joueur qui change de serveur garde son score. Un seul serveur, le
# meneur, lance les tournois automatiques (minimum-players compte les joueurs de tout le réseau) et conclut :
# classement, victoire, récompenses envoyées une seule fois par runFor, là où se trouve le joueur ou à sa prochaine
# connexion. /shfasttournament start, stop, custom et status marchent depuis n'importe quel serveur.
# Les sections 'settings' (récompenses comprises) et 'tournaments' doivent être les mêmes sur tous les serveurs.
reseau:
  actif: true
  # Canal du bus SHNetwork où les serveurs s'annoncent le début, l'arrêt et la fin d'un tournoi
  canal: fasttournament
  # Intervalle, en millisecondes, entre deux envois des points à la base et deux relevés des points de tous les serveurs.
  # C'est le retard maximal du classement affiché dans la boss bar, et les points qu'un arrêt brutal du serveur peut perdre.
  synchro-ms: 1000
  # Intervalle, en secondes, entre deux recherches d'un tournoi en cours quand ce serveur n'en suit aucun
  # (message perdu, serveur qui vient de démarrer)
  veille-secondes: 5
  # Attente, en secondes, entre l'heure de fin et la conclusion par le meneur : chaque serveur envoie ses derniers points
  delai-conclusion-secondes: 3
  # Un tournoi resté sans conclusion plus longtemps que cela après son heure de fin (aucun meneur pendant ce temps)
  # est abandonné, sans récompense
  abandon-apres-minutes: 60
  # Les points et le classement d'un tournoi terminé sont supprimés de la base après ce nombre de jours ; les victoires restent
  conservation-jours: 14
  # Durée, en secondes, pendant laquelle le nombre de victoires d'un joueur lu en base est gardé en mémoire
  cache-victoires-secondes: 30
  # Base partagée par tous les serveurs : tables fasttournament_runs, fasttournament_scores,
  # fasttournament_results et fasttournament_wins (voir sql/schema.sql)
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
    utilisateur: shfasttournament
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes
    delai-ms: 3000

# Tournois. La clé de chaque entrée est l'id utilisé par /shfasttournament start.
#   enabled           Le tournoi peut être tiré au sort par le lancement automatique.
#   time              Durée en minutes.
#   display-name      Nom affiché (codes couleur avec &).
#   description       Description affichée aux joueurs.
#   type              BLOCK_BREAK, BLOCK_PLACE, KILL_ENTITY, TAKE_DAMAGE, MAKE_DAMAGE, FISHING, JUMP,
#                     WALK, ITEM_PICKUP, SMELT, CROPS_BREAK, CRAFT, CUSTOM (points ajoutés par /shfasttournament custom)
#                     ou PLACEHOLDER (points = ce que gagne le placeholder 'objective' pendant le tournoi, lu
#                     chaque seconde pour chaque joueur connecté ; demande PlaceholderAPI).
#   objective         "NONE" ou identifiants séparés par des virgules (blocs, entités ou items selon le type) ;
#                     pour PLACEHOLDER, le placeholder entre % (exemple : '%cookieclicker_clickerclicks%').
#   blacklist         "NONE" ou identifiants exclus, séparés par des virgules.
#   points-name       Unité des points dans les messages.
#   boss-bar          BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW ou NONE.
#   worlds-blacklist  Mondes où rien ne compte (liste, à omettre si aucun). Sans effet pour PLACEHOLDER.
#   start-commands    Commandes console au début du tournoi, sur chaque serveur qui le suit (liste, facultatif).
#                     %seconds% = secondes restantes, %tournament% = id du tournoi.
#   end-commands      Commandes console à la fin du tournoi, qu'il se termine, soit arrêté ou remplacé (liste, facultatif).
tournaments:
  mineur-de-pierre:
    enabled: true
    time: 10
    display-name: Mineur de pierre
    description: Minez le plus de pierre pour gagner !
    type: BLOCK_BREAK
    objective: STONE,COBBLESTONE
    blacklist: NONE
    points-name: bloc(s) miné(s)
    boss-bar: WHITE
    worlds-blacklist:
    - spawn
  tournoi-custom:
    enabled: false
    time: 5
    display-name: Tournoi à points manuels
    description: Les points sont ajoutés à la main avec /shfasttournament custom
    type: CUSTOM
    objective: EXEMPLE
    blacklist: NONE
    points-name: point(s)
    boss-bar: YELLOW
  tournoi-placeholder:
    enabled: false
    time: 5
    display-name: Tournoi placeholder
    description: Sautez le plus de fois pour gagner !
    type: PLACEHOLDER
    objective: '%statistic_jump%'
    blacklist: NONE
    points-name: saut(s)
    boss-bar: PINK
    start-commands:
    - 'say Le tournoi %tournament% commence dans %seconds% secondes !'
    end-commands:
    - say Le tournoi %tournament% est terminé !
