name: SHFastTournament
version: '${project.version}'
main: org.Cry_Legende.sHFastTournament.SHFastTournament
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, chaque serveur lance ses propres tournois comme avant.
softdepend:
  - SHLogs
  - SHNetwork
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (points, classement et victoires en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  tournament:
    description: Commande principale pour gérer les mini tournois
    usage: /tournament <start|stop|info|status|custom>

permissions:
  shfasttournament.admin:
    description: Permet de gérer les mini tournois via /tournament
    default: op
